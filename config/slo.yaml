service: day13-l3a-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >-
    Trong mỗi cửa sổ 28 ngày, ít nhất 99.5% request nhận response_sent trong
    tối đa 3000 ms; request_failed hoặc response quá 3000 ms tiêu thụ error
    budget. Error budget 0.5% được tính bằng 100% - target 99.5%, tương đương
    tối đa 1 request lỗi/chậm trên mỗi 200 request. Đối chiếu baseline thực tế
    trước khi thay ngưỡng cho một deployment thật.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
